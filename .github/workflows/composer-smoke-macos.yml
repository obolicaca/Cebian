name: macOS Composer Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - spike/browser-python-webtoskill
    paths:
      - '.github/workflows/composer-smoke-macos.yml'
      - 'scripts/smoke-composer.cjs'
      - 'components/chat/**'
      - 'hooks/useBackgroundAgent.ts'
      - 'entrypoints/background/chat/**'
      - 'entrypoints/sidepanel/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  composer-smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: |
          npm install --prefix .scratch/browser-smoke --no-audit --no-fund playwright-core@1.65.1
          node .scratch/browser-smoke/node_modules/playwright-core/cli.js install chromium

      - name: Test composer recovery
        run: node scripts/smoke-composer.cjs
